# BE virtual-simulation demo; shared physical parameters inherit hil.ini General.
include ../hil.ini

[Config BE-Demo]
description = "BE virtual simulation: 18x10 satellites, flow1 every 1s, duration 10s"
scheduler-class = "omnetpp::cSequentialScheduler"
sim-time-limit = 10s
result-dir = demo/output
cmdenv-express-mode = true
cmdenv-redirect-output = false

*.walkerDeltaScenarioManager.numPlanes = 18
*.walkerDeltaScenarioManager.satsPerPlane = 10
*.numStations = 2
*.stations[*].numApps = 1
*.stations[*].ethernet.hasSocketSupport = true
*.stations[0].ieee8021q.typename = "Ieee8021qProtocol"
*.stations[1].ieee8021q.typename = ""

*.enableMatlabOfflineManager = true
*.matlabOfflineManager.configurationFile = "demo/input/be_demo_routes.txt"
*.matlabOfflineManager.schedulingPriority = -85
*.matlabOfflineManager.applyGateSchedules = false
*.matlabOfflineManager.satelliteIndexMap = ""
*.matlabOfflineManager.satelliteGroundInterfaceByVlan = "4"
*.satellite[*].eth[0..3].macLayer.queue.transmissionGate[7].initiallyOpen = true
*.walkerDeltaScenarioManager.numEthInterfacesOverrides = "28 5 163 5"
*.stations[0].mobility.latitude = 18.6058617056deg
*.stations[0].mobility.longitude = -125.856377639deg
*.stations[1].mobility.latitude = 41.6523930159deg
*.stations[1].mobility.longitude = -74.2336407027deg
*.satellite[28].hasIncomingStreams = true
*.satellite[28].hasOutgoingStreams = true
*.satellite[28].hasEgressTrafficShaping = true
*.satellite[28].periodicGateManager.enabled = true
*.satellite[27].hasIncomingStreams = true
*.satellite[27].hasOutgoingStreams = true
*.satellite[27].hasEgressTrafficShaping = true
*.satellite[27].periodicGateManager.enabled = true
*.satellite[17].hasIncomingStreams = true
*.satellite[17].hasOutgoingStreams = true
*.satellite[17].hasEgressTrafficShaping = true
*.satellite[17].periodicGateManager.enabled = true
*.satellite[7].hasIncomingStreams = true
*.satellite[7].hasOutgoingStreams = true
*.satellite[7].hasEgressTrafficShaping = true
*.satellite[7].periodicGateManager.enabled = true
*.satellite[174].hasIncomingStreams = true
*.satellite[174].hasOutgoingStreams = true
*.satellite[174].hasEgressTrafficShaping = true
*.satellite[174].periodicGateManager.enabled = true
*.satellite[173].hasIncomingStreams = true
*.satellite[173].hasOutgoingStreams = true
*.satellite[173].hasEgressTrafficShaping = true
*.satellite[173].periodicGateManager.enabled = true
*.satellite[163].hasIncomingStreams = true
*.satellite[163].hasOutgoingStreams = true
*.satellite[163].hasEgressTrafficShaping = true
*.satellite[163].periodicGateManager.enabled = true

# Original BE flow1 settings, with destination renumbered after removing other flows.
*.stations[0].hasOutgoingStreams = false
*.stations[0].app[0].typename = "EthernetSourceApp"
*.stations[0].app[0].io.interface = "eth0"
*.stations[0].app[0].io.remoteAddress = "stations[1]"
*.stations[0].app[0].source.typename = "ActivePacketSourceMultipleInterval"
*.stations[0].app[0].source.packetLength = 1478B
*.stations[0].app[0].source.productionInterval = 1s
*.stations[0].app[0].source.initialProductionOffset = 0s
*.stations[0].app[0].source.stopTime = 60s
*.stations[0].app[0].source.pcp = 1
*.stations[0].app[0].source.vlanId = 1
*.stations[1].app[0].typename = "RecordFileEthernetSink"
*.stations[1].app[0].interfaceTableModule = "^.interfaceTable"
*.stations[1].app[0].interface = "eth0"
*.stations[1].app[0].localAddress = "stations[1]"
*.stations[1].app[0].recordFile = "${resultdir}/flow1.csv"
*.stations[1].app[0].appendFile = false
*.stations[1].app[0].writeHeader = true
*.stations[1].app[0].steal = true
