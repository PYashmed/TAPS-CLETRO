# BE Flow 10: ...423 -> [SW424 -> SW484] -> 544...
# BE Flow 11: ...367 -> [SW427 -> SW487] -> 547...
# The two hardware-to-hardware ISLs use no host NIC:
#   SW424 eth1 <-> SW484 eth3
#   SW427 eth1 <-> SW487 eth3
#
# Bind every boundary used by the current traffic. Unused logical directions
# stay in the planning topology and have no physical cable. The guard below
# aborts on any frame reaching a shadow via an unwired simulated direction.
# Seven host cables are fixed across all six profiles. Port enp6s0f3 is the
# eighth cable: connect it to SW487 eth2 for BE, or SW424 eth3 for JRS/JRS-TER.
# Both 2TT and 20TT therefore use at most the eight available host NICs.

# enp5s0f0: satellite[423].eth0 <-> SW424 eth2
*.satellite[423].eth[0].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[423].eth[0].phyLayer.externalEnabled = true
*.satellite[423].eth[0].phyLayer.device = "enp5s0f0"
*.satellite[423].eth[0].phyLayer.networkNamespace = ""

# enp5s0f1: satellite[425].eth2 <-> SW424 eth0
*.satellite[425].eth[2].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[425].eth[2].phyLayer.externalEnabled = true
*.satellite[425].eth[2].phyLayer.device = "enp5s0f1"
*.satellite[425].eth[2].phyLayer.networkNamespace = ""

# enp5s0f2: satellite[483].eth0 <-> SW484 eth2
*.satellite[483].eth[0].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[483].eth[0].phyLayer.externalEnabled = true
*.satellite[483].eth[0].phyLayer.device = "enp5s0f2"
*.satellite[483].eth[0].phyLayer.networkNamespace = ""

# enp5s0f3: satellite[485].eth2 <-> SW484 eth0
*.satellite[485].eth[2].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[485].eth[2].phyLayer.externalEnabled = true
*.satellite[485].eth[2].phyLayer.device = "enp5s0f3"
*.satellite[485].eth[2].phyLayer.networkNamespace = ""

# enp6s0f0: satellite[544].eth3 <-> SW484 eth1
*.satellite[544].eth[3].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[544].eth[3].phyLayer.externalEnabled = true
*.satellite[544].eth[3].phyLayer.device = "enp6s0f0"
*.satellite[544].eth[3].phyLayer.networkNamespace = ""

# enp6s0f1: satellite[367].eth1 <-> SW427 eth3
*.satellite[367].eth[1].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[367].eth[1].phyLayer.externalEnabled = true
*.satellite[367].eth[1].phyLayer.device = "enp6s0f1"
*.satellite[367].eth[1].phyLayer.networkNamespace = ""

# enp6s0f2: satellite[547].eth3 <-> SW487 eth1
*.satellite[547].eth[3].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[547].eth[3].phyLayer.externalEnabled = true
*.satellite[547].eth[3].phyLayer.device = "enp6s0f2"
*.satellite[547].eth[3].phyLayer.networkNamespace = ""

# One listener covers all four shadows; any software forwarding would be wrong.
*.satellite[423].eth[0].phyLayer.enableShadowGuard = true
*.satellite[423].eth[0].phyLayer.shadowSatellites = "424 484 427 487"

# Native MAC queues/CBS/gates and dynamic delay on wired boundaries are retained.
# The two direct hardware ISLs use their actual physical delay (see ../../README.md).

[Config HIL-BE-Ports]
extends = HIL-Base
description = "BE wiring: eighth host cable goes to SW487 eth2"
# enp6s0f3: satellite[486].eth0 <-> SW487 eth2
*.satellite[486].eth[0].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[486].eth[0].phyLayer.externalEnabled = true
*.satellite[486].eth[0].phyLayer.device = "enp6s0f3"
*.satellite[486].eth[0].phyLayer.networkNamespace = ""

[Config HIL-JRS-Ports]
extends = HIL-Base
description = "JRS/JRS-TER wiring: eighth host cable goes to SW424 eth3"
# enp6s0f3: satellite[364].eth1 <-> SW424 eth3
*.satellite[364].eth[1].phyLayer.typename = "satnet3d.hil.HilEthernetPhyLayer"
*.satellite[364].eth[1].phyLayer.externalEnabled = true
*.satellite[364].eth[1].phyLayer.device = "enp6s0f3"
*.satellite[364].eth[1].phyLayer.networkNamespace = ""

[Config HIL-BE-2TT]
extends = HIL-BE-Ports, XwBETraffic2TT
description = "Best effort 2TT with four physical switches"
result-dir = results/be-2tt
*.enableMatlabOfflineManager = true
*.matlabOfflineManager.configurationFile = "offline/xw-BE/xw_BE_2TT_omnet_config.txt"
*.matlabOfflineManager.schedulingPriority = -85
*.matlabOfflineManager.applyGateSchedules = false
*.satellite[*].eth[0..3].macLayer.queue.transmissionGate[7].initiallyOpen = true
*.stations[11..21].app[0].typename = "satnet3d.hil.HilRecordFileEthernetSink"

[Config HIL-BE-20TT]
extends = HIL-BE-Ports, XwBETraffic20TT
description = "Best effort 20TT with four physical switches"
result-dir = results/be-20tt
*.enableMatlabOfflineManager = true
*.matlabOfflineManager.configurationFile = "offline/xw-BE/xw_BE_20TT_omnet_config.txt"
*.matlabOfflineManager.schedulingPriority = -85
*.matlabOfflineManager.applyGateSchedules = false
*.satellite[*].eth[0..3].macLayer.queue.transmissionGate[7].initiallyOpen = true
*.stations[29..57].app[0].typename = "satnet3d.hil.HilRecordFileEthernetSink"

[Config HIL-JRS-TER-2TT]
extends = HIL-JRS-Ports, XwJRSTERTraffic2TT
description = "Ground Gated 2TT with four physical switches"
result-dir = results/jrs-ter-2tt
*.stations[9..10].app[0].maxRetransmissions = 10
*.enableMatlabOfflineManager = true
*.matlabOfflineManager.configurationFile = "offline/xw-JRS-TER/xw_JRS_TER_2TT_omnet_config.txt"
*.matlabOfflineManager.schedulingPriority = -85
*.matlabOfflineManager.openPcp7AtScheduleEnd = true
*.stations[11..19].app[0].typename = "satnet3d.hil.HilRecordFileEthernetSink"

