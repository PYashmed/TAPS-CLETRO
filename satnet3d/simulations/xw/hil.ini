# XW hardware-in-the-loop configuration. See ../../README.md before connecting devices.
# Four shadows on BE Flow 10/11: satellite[424], [484], [427], [487].
# Shared simulation settings are embedded below.
# Offline routes/GCL and traffic exports retain their original values.
# Shared simulation configuration, embedded for this distribution.
include xw_JRS_2TT_omnet_traffic.ini
include xw_JRS_20TT_omnet_traffic.ini
include xw_BE_2TT_omnet_traffic.ini
include xw_BE_20TT_omnet_traffic.ini
include xw_JRS_TER_2TT_omnet_traffic.ini
include xw_JRS_TER_20TT_omnet_traffic.ini

[General]
simtime-resolution = ps
network = satnet3d.simulations.xw.Xw
record-eventlog = false
cmdenv-event-banners = false
**.cmdenv-log-level = WARN

# Record only packet counts at the ground-source and ground-destination apps.
# EthernetSourceApp emits packetSent in its io submodule; ReliableEthernetSource
# emits the same statistic directly in app[0]. The latter count includes retries.
*.stations[*].app[0].io.packetSent.result-recording-modes = count
*.stations[*].app[0].io.packetSent:count.scalar-recording = true
*.stations[*].app[0].packetSent.result-recording-modes = count
*.stations[*].app[0].packetSent:count.scalar-recording = true
# For reliable flows, each packetGenerated event assigns one new sequence
# number. Its count is therefore the number of unique sequence numbers generated
# by the sender and is the denominator for the end-to-end arrival rate.
*.stations[*].app[0].packetGenerated.result-recording-modes = count
*.stations[*].app[0].packetGenerated:count.scalar-recording = true
# Both RecordFileEthernetSink and ReliableEthernetSink emit packetReceived from
# app[0]. For a reliable sink this counts every received attempt, including an
# attempt selected by the simulated loss model.
*.stations[*].app[0].packetReceived.result-recording-modes = count
*.stations[*].app[0].packetReceived:count.scalar-recording = true
**.scalar-recording = false
**.vector-recording = false
**.result-recording-modes = -

# Keep the scene origin at the Earth center, as in the fxa reference scenario.
*.coordinateSystem.sceneLatitude = 0deg
*.coordinateSystem.sceneLongitude = 0deg
*.coordinateSystem.sceneAltitude = -6378137m
*.coordinateSystem.sceneHeading = 90deg
*.coordinateSystem.sceneElevation = 0deg
*.coordinateSystem.sceneBank = 0deg

# Complete 60 x 60 Walker-Delta constellation.
*.walkerDeltaScenarioManager.numPlanes = 60
*.walkerDeltaScenarioManager.satsPerPlane = 60
*.walkerDeltaScenarioManager.phaseFactor = 23
*.walkerDeltaScenarioManager.orbitalAltitude = 500km
*.walkerDeltaScenarioManager.orbitalInclination = 58deg
*.walkerDeltaScenarioManager.numEthInterfaces = 4
*.walkerDeltaScenarioManager.datarate = 1Gbps
*.walkerDeltaScenarioManager.propagationSpeed = 299792458mps
*.topologyCoordinator.datarate = 1Gbps
*.topologyCoordinator.propagationSpeed = 299792458mps
*.groundToSatTopologyManager.datarate = 1Gbps
*.groundToSatTopologyManager.propagationSpeed = 299792458mps
*.groundToSatTopologyManager.updateInterval = 100s
*.groundToSatTopologyManager.peerNumGateInterfaces = -1

# Batch orbital motion and link-delay updates every 100 ms. The GSL association
# is selected at t=0 and is unchanged during the 60-second run.
*.mobilityManager.enabled = true
*.mobilityManager.schedulingPriority = -100
*.dynamicChannelManager.enabled = true
*.dynamicChannelManager.updateInterval = 0.1s
*.dynamicChannelManager.schedulingPriority = -90
*.groundToSatTopologyManager.updateSchedulingPriority = -70
*.satellite[*].mobility.useMobilityManager = true
*.satellite[*].mobility.mobilityManagerModule = "^.^.mobilityManager"
*.stations[*].mobility.useMobilityManager = true
*.stations[*].mobility.mobilityManagerModule = "^.^.mobilityManager"
**.channel.useDynamicChannelManager = true
**.channel.dynamicChannelManagerModule = "^.dynamicChannelManager"

*.stations[*].mobility.altitude = 0m

# All physical links use 1 Gbit/s. Each station uses eth0 for its direct GSL;
# satellite GSL ports start at eth4 and are allocated only where required.
*.satellite[*].eth[*].bitrate = 1Gbps
*.stations[*].eth[*].bitrate = 1Gbps
*.satellite[*].numApps = 0
*.stations[*].hasIpv4 = false
*.stations[*].hasIpv6 = false
*.stations[*].hasTcp = false
*.stations[*].hasUdp = false
*.stations[*].numLoInterfaces = 0

# VLAN-aware static forwarding is installed by MatlabOfflineScheduleManager.
*.satellite[*].bridging.interfaceRelay.learner.typename = ""
*.satellite[*].bridging.interfaceRelay.selector.typename = "satnet3d.offline.OfflineVlanAwareRelayInterfaceSelector"
*.satellite[*].macTable.agingTime = 1000000s

# The generated traffic profile enables shaped queues only on satellites that
# occur in that profile's exported route/GCL region.
*.satellite[*].hasIncomingStreams = false
*.satellite[*].hasOutgoingStreams = false
*.satellite[*].hasEgressTrafficShaping = false
*.satellite[*].bridging.streamCoder.decoder.mapping = [ \
    {pcp: 0, stream: "pcp0"}, {pcp: 1, stream: "pcp1"}, {pcp: 2, stream: "pcp2"}, {pcp: 3, stream: "pcp3"}, \
    {pcp: 4, stream: "pcp4"}, {pcp: 5, stream: "pcp5"}, {pcp: 6, stream: "pcp6"}, {pcp: 7, stream: "pcp7"}]
*.satellite[*].bridging.streamCoder.encoder.mapping = [ \
    {stream: "pcp0", pcp: 0}, {stream: "pcp1", pcp: 1}, {stream: "pcp2", pcp: 2}, {stream: "pcp3", pcp: 3}, \
    {stream: "pcp4", pcp: 4}, {stream: "pcp5", pcp: 5}, {stream: "pcp6", pcp: 6}, {stream: "pcp7", pcp: 7}]
*.satellite[*].eth[*].macLayer.queue.numTrafficClasses = 8
*.satellite[*].eth[*].macLayer.queue.queue[*].packetCapacity = 1000
*.satellite[*].eth[*].macLayer.queue.queue[*].dropperClass = "inet::queueing::PacketAtCollectionEndDropper"
*.satellite[*].eth[*].macLayer.queue.transmissionSelection.reverseOrder = true

# Ground devices use a simple PacketQueue rather than the satellite's
# eight-class compound queue. Bound this source-side queue so the 10 us BE
# overload is represented by packet drops instead of unbounded memory growth.
*.stations[*].eth[*].macLayer.queue.packetCapacity = 1000
*.stations[*].eth[*].macLayer.queue.dropperClass = "inet::queueing::PacketAtCollectionEndDropper"

# Only PCP 5 and PCP 6 use CBS. idleSlopeFactor=0.5 on a 1 Gbit/s link is
# represented by INET's absolute idleSlope parameter as 500 Mbit/s.
*.satellite[*].eth[*].macLayer.queue.transmissionSelectionAlgorithm[5..6].typename = "Ieee8021qCreditBasedShaper"
*.satellite[*].eth[*].macLayer.queue.transmissionSelectionAlgorithm[5..6].idleSlope = 500Mbps

# ISL gates default to 01111111 (queue 7 closed, queues 6..0 open). During the
# WINDOWS intervals only queue 7 changes to open, yielding 11111111; queues
# 0..6 stay open throughout. GSL gates are permanently open. Frame preemption
# is not configured; implicit guard bands use the gate module default (enabled).
*.satellite[*].periodicGateManager.enabled = false
*.satellite[*].periodicGateManager.schedulingPriority = -80
*.satellite[*].eth[*].macLayer.queue.transmissionGate[*].typename = "SatNet3DPeriodicGate"
*.satellite[*].eth[*].macLayer.queue.transmissionGate[*].usePeriodicGateManager = true
*.satellite[*].eth[*].macLayer.queue.transmissionGate[*].periodicGateManagerModule = "^.^.^.^.periodicGateManager"
*.satellite[*].eth[0..3].macLayer.queue.transmissionGate[0..6].initiallyOpen = true
*.satellite[*].eth[0..3].macLayer.queue.transmissionGate[7].initiallyOpen = false
*.satellite[*].eth[4..6].macLayer.queue.transmissionGate[*].initiallyOpen = true
*.satellite[*].eth[*].macLayer.queue.transmissionGate[*].durations = []

# The generated BE configuration supplies the multiple-interval timing values.
*.stations[0..8].app[0].source.typename = "ActivePacketSourceMultipleInterval"

[Config HIL-Base]
description = "Common HIL boundary configuration; choose one HIL-* traffic profile"
scheduler-class = "satnet3d::SatNet3DRealTimeScheduler"
cmdenv-express-mode = false
cmdenv-redirect-output = true

# AF_PACKET needs serialized frames with computed checksums.
**.fcsMode = "computed"
**.checksumMode = "computed"

# Ordinary Ethernet flows carry sequence/time in 36 bytes of their existing
# payload. Reliable flows keep ReliableEthernetSource/Sink and their retry rules.
*.stations[*].app[0].source.typename = "satnet3d.hil.HilActivePacketSource"

